name: lineagex
services:
  app:
    build: .
    container_name: lineagex-app
    ports: ["${APP_PORT:-18214}:8000"]
    environment:
      - APP_PORT=${APP_PORT:-18214}
      - LINEAGEX_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lineagex-data:/app/data
volumes:
  lineagex-data:
